<div id="telldo-calendar-design" aria-label="Telldo 计划日历交互草图">
<style>
#telldo-calendar-design{--paper:light-dark(#fff,#20232c);--side:light-dark(#f0f2f8,#252a36);--ink:light-dark(#35415b,#e3e8f5);--sub:light-dark(#78849a,#a5aec2);--line:light-dark(#e4e8f1,#3a4354);--soft:light-dark(#f7f8fc,#292f3c);--brand:light-dark(#6073d0,#a8b8ff);--tint:light-dark(#e6ebfc,#343e61);--danger:light-dark(#b55d58,#ffaaa3);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:var(--ink)}
#telldo-calendar-design *{box-sizing:border-box}#telldo-calendar-design button,#telldo-calendar-design input,#telldo-calendar-design select{font:inherit;color:inherit}#telldo-calendar-design button{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 9px}#telldo-calendar-design button:hover{background:var(--soft)}#telldo-calendar-design button[aria-pressed=true]{background:var(--tint);color:var(--brand);border-color:var(--tint)}#telldo-calendar-design input,#telldo-calendar-design select{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px;min-width:0;max-width:100%}#telldo-calendar-design input[type=checkbox]{accent-color:var(--brand)}#telldo-calendar-design .shell{display:grid;grid-template-columns:130px minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:clip}#telldo-calendar-design .side{background:var(--side);padding:20px 12px;display:flex;flex-direction:column;gap:11px}#telldo-calendar-design .logo{font-size:20px;font-weight:600;letter-spacing:-.5px;margin-bottom:20px}#telldo-calendar-design .logo b{color:var(--brand);margin-right:6px}#telldo-calendar-design .nav{padding:9px 10px;border-radius:7px;color:var(--sub)}#telldo-calendar-design .nav.active{background:var(--tint);color:var(--brand)}#telldo-calendar-design .muted{color:var(--sub);font-size:11px}#telldo-calendar-design .side-label{font-size:11px;color:var(--sub);margin-top:18px;padding-left:10px}#telldo-calendar-design .main{min-width:0}#telldo-calendar-design .crumb{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--sub);font-size:11px}#telldo-calendar-design .heading{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#telldo-calendar-design h2{margin:0;font-size:22px;font-weight:600}#telldo-calendar-design .segment{display:flex;gap:3px}#telldo-calendar-design .tools{padding:0 20px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}#telldo-calendar-design .month-label{font-size:14px;font-weight:500;min-width:102px}#telldo-calendar-design .tools .filters{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}#telldo-calendar-design .workspace{display:grid;grid-template-columns:minmax(0,1fr) 214px;border-top:1px solid var(--line)}#telldo-calendar-design .calendar-area{min-width:0}#telldo-calendar-design .weekhead,#telldo-calendar-design .monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}#telldo-calendar-design .weekhead>span{text-align:center;padding:10px 0;color:var(--sub);font-size:11px}#telldo-calendar-design .day{min-height:96px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:4px;min-width:0}#telldo-calendar-design .day:nth-child(7n){border-right:0}#telldo-calendar-design .day.selected{background:var(--soft)}#telldo-calendar-design .day.outside{background:var(--soft);color:var(--sub)}#telldo-calendar-design .day.drop{background:var(--tint)}#telldo-calendar-design .daytop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}#telldo-calendar-design .date-button{padding:2px 4px;border:0;background:transparent;font-size:11px}#telldo-calendar-design .today .date-button:not([data-add]){background:var(--brand);color:var(--paper);border-radius:5px}#telldo-calendar-design .entry{display:block;width:100%;text-align:left;padding:4px 5px;margin:3px 0;background:var(--tint);border:0;border-radius:4px;font-size:11px;white-space:normal;overflow-wrap:anywhere;line-height:1.45;cursor:grab;touch-action:none}#telldo-calendar-design .entry.deadline{background:transparent;color:var(--sub);border-left:2px solid var(--line);border-radius:0;cursor:default}#telldo-calendar-design .entry.overdue{color:var(--danger)}#telldo-calendar-design .entry.done{text-decoration:line-through;color:var(--sub);background:var(--soft)}#telldo-calendar-design .entry small{display:block;font-size:11px;color:var(--sub)}#telldo-calendar-design .detail{border-left:1px solid var(--line);padding:16px;min-width:0;background:var(--soft)}#telldo-calendar-design .detail h3{font-size:15px;margin:12px 0 16px;line-height:1.5;font-weight:500}#telldo-calendar-design .detail label{display:block;font-size:11px;color:var(--sub);margin:13px 0}#telldo-calendar-design .detail input{display:block;width:100%;margin-top:6px;color:var(--ink)}#telldo-calendar-design .detail .meta{color:var(--sub);font-size:11px;margin:9px 0;line-height:1.6}#telldo-calendar-design .detail .primary{background:var(--brand);color:var(--paper);border:0;width:100%;margin-top:10px}#telldo-calendar-design .day-item{display:block;width:100%;text-align:left;margin:7px 0}#telldo-calendar-design .legend{padding:12px 16px;display:flex;gap:14px;font-size:11px;color:var(--sub);flex-wrap:wrap;border-top:1px solid var(--line)}#telldo-calendar-design .listrow{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}#telldo-calendar-design .listrow>button{text-align:left;flex:1;border:0;background:none}#telldo-calendar-design .listrow small{display:block;color:var(--sub);font-size:11px;margin-top:5px}#telldo-calendar-design .listrow.done>button{text-decoration:line-through}#telldo-calendar-design .unscheduled{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;background:var(--soft);border-top:1px solid var(--line)}#telldo-calendar-design .unscheduled .entry{width:auto;margin:0}#telldo-calendar-design .status{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;background:var(--soft);border-top:1px solid var(--line)}#telldo-calendar-design .empty{padding:25px;color:var(--sub)}#telldo-calendar-design [hidden]{display:none!important}#telldo-calendar-design .work{color:var(--brand)}
@media(max-width:800px){#telldo-calendar-design .shell{grid-template-columns:1fr}#telldo-calendar-design .side{display:none}#telldo-calendar-design .workspace{grid-template-columns:minmax(0,1fr) 190px}#telldo-calendar-design .day{min-height:94px}#telldo-calendar-design .tools .filters{margin-left:0}}
@media(max-width:620px){#telldo-calendar-design .workspace{grid-template-columns:1fr}#telldo-calendar-design .detail{border-left:0;border-top:1px solid var(--line)}#telldo-calendar-design .heading,#telldo-calendar-design .tools{padding-left:12px;padding-right:12px}#telldo-calendar-design .day{min-height:75px;padding:2px}#telldo-calendar-design .entry{padding:3px 2px;font-size:11px}#telldo-calendar-design .entry small{display:none}#telldo-calendar-design .crumb{padding:14px 12px}}
</style>
<div class="shell">
<aside class="side"><div class="logo"><b>t.</b>Telldo</div><div class="nav">今天</div><div class="nav active">计划</div><div class="nav">随时</div><div class="side-label">我的清单</div><div class="nav">工作</div><div class="nav">生活</div><div class="nav">随时再说</div></aside>
<main class="main"><div class="crumb"><span>我的空间 / 计划</span><span>交互草图 · 示例数据</span></div><div class="heading"><h2>计划 <span id="td-count" class="muted"></span></h2><div class="segment" role="group" aria-label="显示方式"><button class="cursor-interaction" data-mode="list" aria-pressed="false">列表</button><button class="cursor-interaction" data-mode="month" aria-pressed="true">月历</button></div></div><div class="tools"><button class="cursor-interaction" id="td-prev" aria-label="上个月">‹</button><span class="month-label" id="td-month-label"></span><button class="cursor-interaction" id="td-next" aria-label="下个月">›</button><button class="cursor-interaction" id="td-today">本月</button><div class="filters"><select aria-label="清单筛选" id="td-filter"><option value="all">全部清单</option><option value="work">工作</option><option value="life">生活</option></select><label class="muted"><input id="td-completed" type="checkbox"> 已完成</label><button class="cursor-interaction" id="td-unscheduled">待安排 2</button></div></div><div id="td-unscheduled-panel" class="unscheduled" hidden></div><div class="workspace"><div class="calendar-area"><div id="td-month"><div class="weekhead"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="monthgrid" id="td-grid"></div></div><div id="td-list" hidden></div><div class="legend"><span>▰ 任务：安排日期优先</span><span>◇ 截止标记：同一任务</span><span>↻ 单次重复实例</span></div></div><aside class="detail" id="td-detail"></aside></div><div class="status"><span id="td-status" aria-live="polite">2026 年 11 月 · Asia/Shanghai</span><button id="td-undo" class="cursor-interaction" hidden>撤销</button></div></main>
</div>
<script>
(()=>{
const root=document.getElementById('telldo-calendar-design');const $=id=>root.querySelector('#'+id);
const initial=[
{id:'release',title:'准备发布说明',list:'work',planned:'2026-11-16',due:'2026-11-19',time:'',done:false},
{id:'report',title:'交周报',list:'work',planned:null,due:'2026-11-20',time:'15:00',done:false},
{id:'health',title:'年度体检',list:'life',planned:null,due:'2026-11-18',time:'',done:false},
{id:'receipt',title:'归档报销凭证',list:'work',planned:null,due:'2026-11-13',time:'',done:false},
{id:'archive',title:'整理上周资料',list:'work',planned:null,due:'2026-11-12',time:'',done:true},
{id:'budget',title:'准备年度预算',list:'work',planned:'2026-10-30',due:'2026-11-25',time:'',done:false},
{id:'read-17',title:'读十页书',list:'life',planned:null,due:'2026-11-17',time:'20:00',done:false,repeat:true},
{id:'read-18',title:'读十页书',list:'life',planned:null,due:'2026-11-18',time:'20:00',done:false,repeat:true},
{id:'read-19',title:'读十页书',list:'life',planned:null,due:'2026-11-19',time:'20:00',done:false,repeat:true},
{id:'idea',title:'梳理日历反馈',list:'work',planned:null,due:null,time:'',done:false},
{id:'walk',title:'去公园散步',list:'life',planned:null,due:null,time:'',done:false}];
let tasks=structuredClone(initial),year=2026,month=10,mode='month',selected='release',day='2026-11-16',filter='all',showDone=false,drawer=false,history=[],dragId=null;
const design={maxPerDay:2};
const pad=n=>String(n).padStart(2,'0'),key=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const monthKey=()=>year+'-'+pad(month+1),inMonth=d=>!!d&&d.slice(0,7)===monthKey(),mainDate=t=>t.planned||t.due;
const eligible=t=>(showDone||!t.done)&&(filter==='all'||t.list===filter);
const visible=()=>tasks.filter(t=>eligible(t)&&(inMonth(mainDate(t))||inMonth(t.due)));
const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:'Telldo计划月历',view:mode,month:monthKey(),selectedTask:tasks.find(t=>t.id===selected)?.title||null},privateContent:{tasks,year,month,mode,selected,day,filter,showDone,drawer}}).catch(()=>{});}
function restore(value){const s=value?.privateContent;if(s&&Array.isArray(s.tasks)&&s.tasks.length<=50){tasks=s.tasks;year=s.year||2026;month=Number.isInteger(s.month)?s.month:10;mode=s.mode==='list'?'list':'month';selected=s.selected||null;day=s.day||'2026-11-16';filter=s.filter||'all';showDone=!!s.showDone;drawer=!!s.drawer;}}
function mutate(fn,msg){$('td-status').removeAttribute('role');history.push(structuredClone(tasks));fn();$('td-status').textContent=msg;$('td-undo').hidden=false;render();persist();}
function select(id){selected=id;render();persist();}
function move(id,target){const t=tasks.find(t=>t.id===id);if(!t||!target)return;const field=t.planned||!t.due?'planned':'due',old=t[field];if(old===target)return;mutate(()=>{t[field]=target;selected=id;day=target},(t.repeat?'仅本次：':'')+(field==='planned'?'安排':'截止')+' '+(old||'未安排')+' → '+target+(field==='planned'&&t.due?'；截止 '+t.due+' 保持不变':t.time?'；保留 '+t.time:''));}
function entries(date){let rows=[];for(const t of visible()){if(mainDate(t)===date)rows.push({t,marker:false});else if(t.due===date&&t.planned&&t.planned!==t.due)rows.push({t,marker:true});}return rows.sort((a,b)=>Number(a.marker)-Number(b.marker)||(a.t.time||'').localeCompare(b.t.time||''));}
function entry(t,marker){const overdue=t.due&&t.due<'2026-11-14'&&!t.done;return '<button class="entry cursor-interaction '+(marker?'deadline ':'')+(overdue?'overdue ':'')+(t.done?'done':'')+'" '+(!marker?'':'')+'data-task="'+t.id+'" aria-label="'+html((marker?'截止标记：':'任务：')+t.title)+'">'+(marker?'◇ ':t.repeat?'↻ ':'')+html(t.title)+'<small>'+html(marker?'截止'+(t.time?' '+t.time:''):t.planned?(t.due?'安排 · '+t.due.slice(5)+' 截止':'安排'):(t.time?t.time+' 截止':'日期截止'))+'</small></button>';}
function render(){
 $('td-count').textContent=visible().length+' 项';$('td-month-label').textContent=year+' 年 '+(month+1)+' 月';root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('td-filter').value=filter;$('td-completed').checked=showDone;$('td-month').hidden=mode!=='month';$('td-list').hidden=mode!=='list';
 const first=new Date(Date.UTC(year,month,1)),start=new Date(Date.UTC(year,month,1-(first.getUTCDay()+6)%7));let grid='';
 for(let i=0;i<42;i++){const d=new Date(start);d.setUTCDate(start.getUTCDate()+i);const date=key(d),outside=d.getUTCMonth()!==month,items=outside?[]:entries(date);grid+='<div class="day '+(outside?'outside ':'')+(date===day?'selected ':'')+(date==='2026-11-14'?'today':'')+'" data-date="'+date+'"><div class="daytop"><button class="date-button cursor-interaction" data-day="'+date+'" aria-label="查看 '+date+'">'+d.getUTCDate()+'</button>'+(!outside?'<button class="date-button cursor-interaction" data-add="'+date+'" aria-label="安排任务到 '+date+'">+</button>':'')+'</div>'+items.slice(0,design.maxPerDay).map(({t,marker})=>entry(t,marker)).join('')+(items.length>design.maxPerDay?'<button class="date-button cursor-interaction" data-day="'+date+'">+'+(items.length-design.maxPerDay)+' 项</button>':'')+'</div>';}
 $('td-grid').innerHTML=grid;
 const listed=visible().slice().sort((a,b)=>(inMonth(mainDate(a))?mainDate(a):a.due).localeCompare(inMonth(mainDate(b))?mainDate(b):b.due));
 $('td-list').innerHTML=listed.length?listed.map(t=>'<div class="listrow '+(t.done?'done':'')+'"><input type="checkbox" data-check="'+t.id+'" '+(t.done?'checked':'')+' aria-label="完成 '+html(t.title)+'"><button class="cursor-interaction" data-task="'+t.id+'">'+(t.repeat?'↻ ':'')+html(t.title)+'<small>'+html((t.planned?'安排 '+t.planned+' · ':'')+(t.due?'截止 '+t.due+(t.time?' '+t.time:''):'无截止日期'))+'</small></button></div>').join(''):'<div class="empty">本月没有符合筛选条件的任务</div>';
 const pending=tasks.filter(t=>eligible(t)&&!t.planned&&!t.due);$('td-unscheduled').textContent='待安排 '+pending.length;$('td-unscheduled-panel').hidden=!drawer;$('td-unscheduled-panel').innerHTML=pending.length?pending.map(t=>'<button class="entry cursor-interaction" data-task="'+t.id+'">'+html(t.title)+'</button>').join(''):'<span class="muted">当前清单没有待安排任务</span>';
 const t=tasks.find(t=>t.id===selected);if(t){$('td-detail').innerHTML='<div class="muted">'+(t.repeat?'重复任务 · 仅本次':'任务详情')+'</div><h3>'+html(t.title)+'</h3><div class="meta">'+(t.list==='work'?'工作':'生活')+(t.repeat?' · 每日重复':'')+'</div><label>安排日期<input id="td-plan-date" type="date" value="'+(t.planned||'')+'" '+(t.repeat?'disabled':'')+'></label><label>截止日期<input id="td-due-date" type="date" value="'+(t.due||'')+'"></label>'+(t.time?'<div class="meta">'+t.time+' · Asia/Shanghai</div>':'')+'<button class="primary cursor-interaction" id="td-save">保存日期</button><button class="cursor-interaction" id="td-toggle" style="width:100%;margin-top:8px">'+(t.done?'恢复未完成':'完成任务')+'</button><div class="meta">'+(t.planned&&t.due?'安排日期和截止日期分别保存。':t.repeat?'改期只影响这一实例。':'日期任务没有默认开始时间。')+'</div>';
 $('td-save').onclick=()=>{const planned=$('td-plan-date').value||null,due=$('td-due-date').value||null;if(t.repeat&&!due){$('td-status').textContent='重复实例需要截止日期；可改期或完成本次';$('td-status').setAttribute('role','alert');return;}mutate(()=>{if(!t.repeat)t.planned=planned;t.due=due;if(!due)t.time=''},'已更新日期 · '+t.title)};$('td-toggle').onclick=()=>mutate(()=>{t.done=!t.done},t.done?'已恢复任务':'已完成任务');
 }else{const items=entries(day);$('td-detail').innerHTML='<div class="muted">当天任务</div><h3>'+html(day)+'</h3>'+items.map(({t,marker})=>'<button class="day-item cursor-interaction" data-task="'+t.id+'">'+(marker?'◇ 截止：':'')+html(t.title)+'</button>').join('')+'<label>安排一件事<input id="td-new-title" placeholder="任务标题" maxlength="100"></label><button id="td-create" class="primary cursor-interaction">安排到这一天</button>';$('td-create').onclick=()=>{const title=$('td-new-title').value.trim();if(!title)return;const id='new-'+Date.now();mutate(()=>{tasks.push({id,title,list:filter==='life'?'life':'work',planned:day,due:null,time:'',done:false});selected=id},'已安排到 '+day+'；未设置截止日期');};}
 root.querySelectorAll('[data-task]').forEach(b=>{b.onclick=()=>select(b.dataset.task);if(b.draggable)b.ondragstart=e=>{dragId=b.dataset.task;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}});
 root.querySelectorAll('[data-day],[data-add]').forEach(b=>b.onclick=()=>{day=b.dataset.day||b.dataset.add;selected=null;const d=new Date(day+'T12:00:00Z');year=d.getUTCFullYear();month=d.getUTCMonth();render();persist();});
 root.querySelectorAll('.day:not(.outside)').forEach(cell=>{cell.ondragover=e=>{e.preventDefault();cell.classList.add('drop')};cell.ondragleave=()=>cell.classList.remove('drop');cell.ondrop=e=>{e.preventDefault();cell.classList.remove('drop');move(e.dataTransfer.getData('text/plain')||dragId,cell.dataset.date)};});
 root.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const t=tasks.find(x=>x.id===b.dataset.check);mutate(()=>{t.done=b.checked},t.done?'已恢复任务':'已完成任务')});
}
root.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();persist()});$('td-prev').onclick=()=>{const d=new Date(Date.UTC(year,month-1,1));year=d.getUTCFullYear();month=d.getUTCMonth();render();persist()};$('td-next').onclick=()=>{const d=new Date(Date.UTC(year,month+1,1));year=d.getUTCFullYear();month=d.getUTCMonth();render();persist()};$('td-today').onclick=()=>{year=2026;month=10;render();persist()};$('td-filter').onchange=e=>{filter=e.target.value;render();persist()};$('td-completed').onchange=e=>{showDone=e.target.checked;render();persist()};$('td-unscheduled').onclick=()=>{drawer=!drawer;render();persist()};$('td-undo').onclick=()=>{if(!history.length)return;tasks=history.pop();$('td-status').textContent='已撤销上一步';$('td-undo').hidden=!history.length;render();persist()};
let pointerDrag=null,suppressClickUntil=0;
root.addEventListener('pointerdown',e=>{const b=e.target.closest('.entry:not(.deadline)');if(!b||e.button!==0)return;pointerDrag={id:b.dataset.task,x:e.clientX,y:e.clientY,pointerId:e.pointerId,active:false};});
root.addEventListener('pointermove',e=>{if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;if(!pointerDrag.active&&Math.hypot(e.clientX-pointerDrag.x,e.clientY-pointerDrag.y)<5)return;pointerDrag.active=true;root.setPointerCapture(e.pointerId);root.querySelectorAll('.day.drop').forEach(c=>c.classList.remove('drop'));const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.day:not(.outside)');if(cell&&root.contains(cell))cell.classList.add('drop');e.preventDefault();});
root.addEventListener('pointerup',e=>{if(!pointerDrag)return;const drag=pointerDrag;pointerDrag=null;if(!drag.active)return;const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.day:not(.outside)');root.querySelectorAll('.day.drop').forEach(c=>c.classList.remove('drop'));if(root.hasPointerCapture(e.pointerId))root.releasePointerCapture(e.pointerId);suppressClickUntil=Date.now()+150;if(cell&&root.contains(cell))move(drag.id,cell.dataset.date);e.preventDefault();});
root.addEventListener('pointercancel',()=>{pointerDrag=null;root.querySelectorAll('.day.drop').forEach(c=>c.classList.remove('drop'));});
root.addEventListener('click',e=>{if(e.target===root&&Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();}},true);
restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render()}});
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(design,'maxPerDay',{label:'每格展示条数',min:1,max:3,step:1,unit:'项'});}
